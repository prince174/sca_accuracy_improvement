name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: sca_test
          POSTGRES_USER: sca_test
          POSTGRES_PASSWORD: sca_test_local
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready -U sca_test -d sca_test" --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      SCA_TEST_EVIDENCE_DSN: postgresql://sca_test:sca_test_local@localhost:5432/sca_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: uv sync --locked --extra dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: uv build

  golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: uv sync --locked --extra dev
      - name: Build golden Maven artifacts
        run: uv run python golden/build.py
      - name: Install pinned Syft
        run: |
          curl -sSfL https://github.com/anchore/syft/releases/download/v1.51.1/syft_1.51.1_linux_amd64.tar.gz -o /tmp/syft.tar.gz
          curl -sSfL https://github.com/anchore/syft/releases/download/v1.51.1/syft_1.51.1_checksums.txt -o /tmp/checksums.txt
          cp /tmp/syft.tar.gz /tmp/syft_1.51.1_linux_amd64.tar.gz
          (cd /tmp && grep ' syft_1.51.1_linux_amd64.tar.gz$' checksums.txt | sha256sum -c -)
          sudo tar -xzf /tmp/syft.tar.gz -C /usr/local/bin syft
      - name: Reconcile image and enforce golden decisions
        run: |
          uv run sca-accuracy \
            --sbom golden/app/target/bom.json \
            --source golden/app \
            --dependency-tree golden/app/target/dependency-tree.json \
            --image sca-accuracy-golden:latest \
            --output out/golden \
            --expectations golden/expected-statuses.json \
            --findings golden/findings.vdr.json \
            --vex-mode safe \
            --vulnerability-rules golden/vulnerability-rules.json \
            --vex-expectations golden/expected-vex-states.json
      - name: Verify multi-ecosystem image and source fixture
        run: uv run python golden/universal/verify.py
      - name: Verify code and metadata mismatches using real Syft scans
        run: uv run python golden/evidence/verify_contradictions.py
      - name: Validate CycloneDX VEX
        run: |
          docker run --rm \
            --mount "type=bind,source=$PWD/out/golden,target=/data" \
            cyclonedx/cyclonedx-cli:0.33.1 validate \
            --input-file /data/vex.json --fail-on-errors
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: golden-analysis
          path: out/golden/

  service:
    runs-on: ubuntu-latest
    env:
      SCA_POSTGRES_PASSWORD: ci-local-evidence
      SCA_API_TOKEN: ci-local-api
      SCA_PORT: "18087"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - run: docker build --tag sca-accuracy-service:ci .
      - name: Start service and wait for healthcheck
        run: |
          docker run --detach --name sca-accuracy-service-ci sca-accuracy-service:ci
          for attempt in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' sca-accuracy-service-ci)
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              docker logs sca-accuracy-service-ci
              exit 1
            fi
            sleep 1
          done
          docker logs sca-accuracy-service-ci
          exit 1
      - if: always()
        run: docker rm --force sca-accuracy-service-ci || true
      - name: Start evidence service with PostgreSQL
        run: |
          mkdir -p workspace/evidence-acceptance out
          docker compose up --build --wait -d
      - name: Scan six real packaging images and verify evidence API
        run: uv run python golden/evidence/verify_service.py
      - if: always()
        run: docker compose down
