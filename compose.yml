services:
  sca-accuracy:
    build: .
    ports:
      - "${SCA_BIND_ADDRESS:-127.0.0.1}:${SCA_PORT:-8080}:8080"
    environment:
      SCA_API_TOKEN: ${SCA_API_TOKEN:-}
      SCA_API_TOKEN_FILE: ${SCA_API_TOKEN_FILE:-}
      SCA_WORKERS: ${SCA_WORKERS:-2}
      SCA_EVIDENCE_DSN: postgresql://sca:${SCA_POSTGRES_PASSWORD:?Set SCA_POSTGRES_PASSWORD}@evidence-db:5432/sca
      SCA_EVIDENCE_BLOBS: /workspace/evidence-blobs
      SCA_EVIDENCE_RETRIEVAL: ${SCA_EVIDENCE_RETRIEVAL:-false}
      SCA_EVIDENCE_REVIEWERS: ${SCA_EVIDENCE_REVIEWERS:-}
      SCA_TEAMCITY_HOSTS: ${SCA_TEAMCITY_HOSTS:-}
      SCA_BITBUCKET_HOSTS: ${SCA_BITBUCKET_HOSTS:-}
      SCA_NEXUS_HOSTS: ${SCA_NEXUS_HOSTS:-}
      SCA_TEAMCITY_TOKEN: ${SCA_TEAMCITY_TOKEN:-}
      SCA_TEAMCITY_TOKEN_FILE: ${SCA_TEAMCITY_TOKEN_FILE:-}
      SCA_BITBUCKET_TOKEN: ${SCA_BITBUCKET_TOKEN:-}
      SCA_BITBUCKET_TOKEN_FILE: ${SCA_BITBUCKET_TOKEN_FILE:-}
      SCA_CA_BUNDLE: ${SCA_CA_BUNDLE:-}
      SCA_MAX_SBOM_BYTES: ${SCA_MAX_SBOM_BYTES:-67108864}
      DOCKER_CONFIG: /run/docker-auth
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      SCA_LLM_API_KEY: ${SCA_LLM_API_KEY:-}
      SCA_LLM_BASE_URL: ${SCA_LLM_BASE_URL:-https://api.deepseek.com/v1}
      SCA_LLM_MODEL: ${SCA_LLM_MODEL:-deepseek-v4-flash}
      SCA_LLM_THINKING: ${SCA_LLM_THINKING:-}
      SCA_LLM_REASONING_EFFORT: ${SCA_LLM_REASONING_EFFORT:-}
      SCA_LLM_MAX_TOKENS: ${SCA_LLM_MAX_TOKENS:-}
      SCA_LLM_TIMEOUT_SECONDS: ${SCA_LLM_TIMEOUT_SECONDS:-120}
    volumes:
      - ./workspace:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
      - ./secrets:/run/secrets:ro
      - ./certs:/run/sca-certs:ro
      - ./docker-config:/run/docker-auth:ro
    restart: unless-stopped
    depends_on:
      evidence-db:
        condition: service_healthy
  evidence-db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: sca
      POSTGRES_USER: sca
      POSTGRES_PASSWORD: ${SCA_POSTGRES_PASSWORD:?Set SCA_POSTGRES_PASSWORD}
    volumes:
      - evidence-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sca -d sca"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  evidence-postgres:
