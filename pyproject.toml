[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sca-accuracy-improvement"
version = "0.4.0"
description = "Evidence-driven reconciliation of CycloneDX SBOMs with multi-ecosystem container images"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "SCA Accuracy Improvement contributors" }]
dependencies = [
    "packageurl-python>=0.17,<1",
]

[project.optional-dependencies]
dev = ["fastapi>=0.115", "httpx>=0.28", "pytest>=8.0", "ruff>=0.9"]
service = ["fastapi>=0.115", "uvicorn>=0.34"]

[project.scripts]
sca-accuracy = "sca_accuracy.cli:main"
sca-accuracy-dtrack = "sca_accuracy.dtrack_cli:main"
sca-accuracy-service = "sca_accuracy.service:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sca_accuracy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
